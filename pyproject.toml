[project]
name = "hybrid-surrogate-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.23.4",
    "eon",
    "fastmcp>=3.4.7",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pymc>=5.28.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tensorflow>=2.21.0",
    "torch>=2.13.0",
]

[project.scripts]
hybrid-surrogate-mcp = "hybrid_surrogate_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
eon = { git = "https://github.com/Mpkosh/Mathematics-of-Epidemics-on-Networks", rev = "my_changes" }
